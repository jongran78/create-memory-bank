<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Bank — Database Write Test</title>

  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 500px;
      padding: 40px;
      text-align: center;
    }

    h1 {
      font-weight: normal;
      letter-spacing: 3px;
    }

    #status {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #444;
      line-height: 1.7;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>MEMORY BANK</h1>
    <p>Private memory database diagnostic</p>

    <div id="status">
      Testing database write permissions...
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase-config.js';

    const status = document.getElementById('status');

    async function runTest() {
      let testMemoryId = null;

      try {
        // Step 1: Ensure visitor has an anonymous identity
        const { data: authData, error: authError } =
          await supabase.auth.signInAnonymously();

        if (authError) throw authError;

        const userId = authData.user.id;

        // Step 2: Create a clearly labeled private test memory
        const { data: insertedMemory, error: insertError } =
          await supabase
            .from('memories')
            .insert({
              owner_id: userId,
              title: 'MEMORY BANK TEST - DELETE ME',
              memory_text: 'Temporary diagnostic record. Not a real memory.',
              memory_type: 'fragment',
              is_public: false,
              moderation_status: 'pending'
            })
            .select('id, title')
            .single();

        if (insertError) throw insertError;

        testMemoryId = insertedMemory.id;

        // Step 3: Confirm the test record can be read by its owner
        const { data: retrievedMemory, error: readError } =
          await supabase
            .from('memories')
            .select('id, title')
            .eq('id', testMemoryId)
            .single();

        if (readError) throw readError;

        if (!retrievedMemory) {
          throw new Error('Test memory was created but could not be retrieved.');
        }

        // Step 4: Delete the temporary test memory
        const { error: deleteError } = await supabase
          .from('memories')
          .delete()
          .eq('id', testMemoryId);

        if (deleteError) throw deleteError;

        // Step 5: Confirm the test record is gone
        const { data: remainingMemory, error: verifyError } =
          await supabase
              .from('memories')
              .select('id')
              .eq('id', testMemoryId)
              .maybeSingle();

        if (verifyError) throw verifyError;

        if (remainingMemory) {
          throw new Error('Test record still exists after deletion.');
        }

        status.innerHTML =
          'DATABASE TEST SUCCESSFUL<br><br>' +
          'Anonymous authentication: successful<br>' +
          'Private memory creation: successful<br>' +
          'Owner retrieval: successful<br>' +
          'Deletion: successful<br>' +
          'Cleanup verification: successful<br><br>' +
          'Temporary test record was removed.';

      } catch (err) {
        console.error('Memory Bank database test:', err);

        // Cleanup attempt if a record was created before failure
        if (testMemoryId) {
          await supabase
            .from('memories')
            .delete()
            .eq('id', testMemoryId);
        }

        status.innerHTML =
          'DATABASE TEST FAILED<br><br>' +
          err.message +
          '<br><br>Cleanup was attempted if a test record had been created.';
      }
    }

    runTest();
  </script>
</body>
</html>
